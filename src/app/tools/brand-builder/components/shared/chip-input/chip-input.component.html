<div class="flex flex-wrap items-center gap-2 p-2 min-h-[48px] border-2 border-border rounded-lg bg-white transition-all duration-200 chip-input-container">
  <div class="flex flex-wrap items-center gap-2 flex-1 chips-wrapper">
    @for (chip of chips; track chip) {
      <span class="inline-flex items-center gap-1.5 px-3 py-1 bg-gray-900 text-white rounded-full text-xs font-bold transition-all duration-200 animate-[scaleIn_0.2s_ease-out] chip">
        {{ chip }}
        <button class="flex items-center justify-center w-4 h-4 rounded-full bg-white/10 hover:bg-white/20 transition-colors opacity-70 chip-remove" (click)="removeChip(chip)" type="button" aria-label="Remove">
          <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </span>
    }
    <input
      class="flex-1 min-w-[120px] bg-transparent border-none outline-none text-sm font-medium text-gray-900 placeholder:text-gray-400 chip-input"
      [placeholder]="chips.length === 0 ? placeholder : 'Add more...'"
      (keydown)="onKeyDown($event)"
      (blur)="onInputBlur($event)"
      type="text"
    />
  </div>
</div>
