<div class="flex flex-col h-screen overflow-hidden bg-white text-gray-900 font-sans">
  <!-- ── Global Header ──────────────────────────────── -->
  <header class="flex items-center justify-between px-6 py-2 border-b border-gray-100 bg-white shrink-0 z-50 relative">
    <div class="flex items-center gap-4" id="ox-logo">
      <div (click)="goHome()" class="cursor-pointer flex items-center gap-2">
        <div
          class="w-7 h-7 bg-black text-white rounded-full flex items-center justify-center font-bold text-[12px] tracking-widest">
          OX</div>
        <div class="flex flex-col leading-none">
          <h1 class="text-[16px] font-black tracking-tight">{{ activeTool || 'OS Builder Hub' }}</h1>
          <span class="text-[10px] text-gray-400 font-medium">v1.0</span>
        </div>
      </div>

      @if (activeTool) {
        <div class="w-px h-4 bg-gray-200"></div>
        <button (click)="goHome()" class="flex items-center gap-1.5 px-3 py-1 bg-gray-50 hover:bg-gray-100 rounded-full text-[10px] font-black uppercase tracking-widest text-gray-500 transition-all">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
          Back to Hub
        </button>
      }
    </div>
    
    <div class="flex items-center gap-2">
      <div class="hidden lg:flex items-center bg-gray-100 p-0.5 rounded-md mx-1 border border-gray-200 opacity-50 pointer-events-none">
        <div class="px-2 text-[8px] font-black uppercase tracking-widest text-gray-400">Context Aware Header</div>
      </div>
    </div>
  </header>

  <!-- ── Main View ──────────────────────────────────── -->
  <router-outlet></router-outlet>
</div>
