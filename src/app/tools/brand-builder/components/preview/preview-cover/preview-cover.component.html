<div class="w-full h-full bg-white preview-cover-wrap">
  @if (data.cover.variant) {
    <app-cover-template
      [templateId]="data.cover.variant"
      [data]="data"
    ></app-cover-template>
  } @else {
    <!-- No template selected yet -->
    <div class="w-full h-full flex flex-col items-center justify-center gap-4 text-center p-12 bg-gray-50 text-gray-400 no-template">
      <div class="text-6xl font-black opacity-10 no-template-icon">◈</div>
      <p class="text-sm font-bold no-template-text leading-relaxed">Select a cover template<br>from the Cover step</p>
    </div>
  }
</div>
