<div
  class="relative flex flex-col items-center justify-center min-h-[140px] p-4 border-2 border-dashed border-border rounded-xl cursor-pointer transition-all duration-300 group overflow-hidden upload-zone"
  [class.has-file]="!!value"
  [class.drag-over]="isDragOver"
  [ngClass]="bgClass ? bgClass : ''"
  (dragover)="onDragOver($event)"
  (dragleave)="onDragLeave($event)"
  (drop)="onDrop($event)"
  (click)="fileInput.click()"
>
  @if (value) {
    <div class="absolute inset-0 w-full h-full flex items-center justify-center p-2 upload-preview" [class.bg-white]="!bgClass" [ngClass]="bgClass">
      <img [src]="value" [alt]="label" class="max-w-full max-h-full object-contain rounded-lg shadow-sm" />
      <button class="absolute top-2 right-2 w-8 h-8 rounded-full bg-white/90 text-error shadow-md border border-error/20 flex items-center justify-center opacity-0 transition-opacity duration-200 hover:bg-error hover:text-white upload-remove" (click)="removeFile($event)" type="button" aria-label="Remove file">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>
  } @else {
    <div class="flex flex-col items-center text-center gap-3 upload-placeholder">
      <div class="w-12 h-12 rounded-2xl flex items-center justify-center transition-transform duration-300 group-hover:scale-110"
        [ngClass]="bgClass ? 'bg-white/20 text-white' : 'bg-gray-50 text-gray-400'">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>
        </svg>
      </div>
      <div class="flex flex-col">
        <span class="text-sm font-bold upload-text" [class.text-gray-900]="!bgClass" [class.text-white]="!!bgClass">{{ label }}</span>
        <span class="text-[11px] font-medium upload-hint" [class.text-gray-400]="!bgClass" [class.text-white]="!!bgClass" [class.opacity-80]="!!bgClass">SVG, PNG, JPG (max. 5MB)</span>
      </div>
    </div>
  }
  <input
    #fileInput
    type="file"
    [accept]="accept"
    (change)="onFileSelected($event)"
    hidden
  />
</div>
