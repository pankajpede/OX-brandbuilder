<div class="relative w-full msd-wrapper" [class.is-open]="isOpen" [class.is-disabled]="isDisabled">
  <!-- Trigger -->
  <button type="button"
    class="flex items-center justify-between w-full min-h-[48px] px-4 py-2 bg-white border-2 border-border rounded-lg text-sm text-left transition-all duration-200 outline-none msd-trigger"
    (click)="toggleDropdown()" [disabled]="isDisabled">
    <span class="font-medium truncate mr-4 msd-placeholder" [class.text-gray-900]="selected.length > 0"
      [class.text-gray-400]="selected.length === 0">
      @if (selected.length === 0) {
      {{ placeholder }}
      } @else {
      {{ selected.length }} selected
      }
    </span>
    <span class="shrink-0 text-gray-400 transition-transform duration-300 msd-arrow">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 12 15 18 9" />
      </svg>
    </span>
  </button>

  <!-- Dropdown Panel -->
  @if (isOpen) {
  <div
    class="absolute left-0 right-0 top-full mt-2 z-50 bg-white border border-border rounded-sm shadow-xl overflow-hidden animate-[fadeInUp_0.2s_ease-out] msd-panel">
    <!-- Search -->
    <div class="relative flex items-center px-2 py-2 border-b border-border msd-search">
      <svg class="absolute left-4 text-gray-400 msd-search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8" />
        <line x1="21" y1="21" x2="16.65" y2="16.65" />
      </svg>
      <input type="text"
        class="w-full pl-7 pr-4 py-1.5 bg-gray-50 border-none outline-none text-sm font-medium text-gray-900 placeholder:text-gray-400 rounded-md msd-search-input"
        placeholder="Search..." [value]="searchTerm" (input)="onSearch($event)" (click)="$event.stopPropagation()" />
    </div>

    <!-- Options -->
    <div class="max-h-[300px] overflow-y-auto msd-options no-scrollbar">
      @for (option of filteredOptions; track option) {
      <button type="button"
        class="flex items-center gap-2 w-full px-3 py-2 text-sm text-gray-700 transition-colors msd-option"
        [class.is-selected]="isSelected(option)"
        [class.is-disabled-option]="!isSelected(option) && selected.length >= maxSelections"
        (click)="toggleOption(option); $event.stopPropagation()">
        <span
          class="flex items-center justify-center w-5 h-5 border-2 border-border rounded transition-all duration-200 msd-checkbox">
          @if (isSelected(option)) {
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
            stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12" />
          </svg>
          }
        </span>
        <span class="font-medium msd-option-label text-[14px]">{{ option }}</span>
      </button>
      }

      @if (filteredOptions.length === 0) {
      <div class="px-4 py-8 text-center text-sm font-medium text-gray-400 msd-empty">No options found</div>
      }
    </div>

    <!-- Footer -->
    @if (maxSelections) {
    <div class="px-4 py-3 bg-gray-50 border-t border-border flex items-center justify-end msd-footer">
      <span class="text-[11px] font-bold text-gray-400 uppercase tracking-wider msd-count">{{ selected.length }} / {{
        maxSelections }} selected</span>
    </div>
    }
  </div>
  }

  <!-- Selected Chips -->
  @if (selected.length > 0) {
  <div class="flex flex-wrap gap-1 mt-2 msd-chips">
    @for (item of selected; track item) {
    <span
      class="inline-flex items-center gap-1 px-2.5 py-1 bg-primary text-white rounded-lg text-xs font-medium text-[10px] transition-all duration-200 animate-[scaleIn_0.2s_ease-out] shadow-sm msd-chip">
      {{ item }}
      <button type="button"
        class="flex items-center justify-center w-4 h-4 rounded-md transition-colors msd-chip-remove"
        (click)="removeItem(item); $event.stopPropagation()" aria-label="Remove">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
          stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
    </span>
    }
  </div>
  }
</div>
