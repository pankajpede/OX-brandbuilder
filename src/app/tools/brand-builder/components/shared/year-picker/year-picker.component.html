<div class="relative w-full year-picker-wrapper" [class.is-open]="isOpen" [class.is-disabled]="isDisabled">
  <!-- Trigger -->
  <button type="button" 
          class="flex items-center justify-between w-full form-input picker-trigger"
          (click)="toggleDropdown()" 
          [disabled]="isDisabled">
    <span class="truncate mr-4" [class.text-gray-900]="selectedYear" [class.text-gray-400]="!selectedYear">
      {{ selectedYear || placeholder }}
    </span>
    <span class="shrink-0 text-gray-400 picker-icon">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/>
      </svg>
    </span>
  </button>

  <!-- Dropdown Panel -->
  @if (isOpen) {
    <div class="absolute left-0 right-0 top-full mt-1.5 z-[100] bg-white border border-border rounded-lg shadow-2xl animate-[fadeInUp_0.2s_ease-out] picker-panel">
      <div class="p-2 border-b border-border bg-gray-50 flex items-center justify-between">
        <span class="text-[10px] font-black uppercase tracking-widest text-gray-400">Select Year</span>
        <span class="text-[10px] font-bold text-gray-400">1900 - {{maxYear}}</span>
      </div>
      
      <div class="max-h-[240px] overflow-y-auto grid grid-cols-4 p-1.5 gap-1.5 no-scrollbar scroll-smooth picker-grid">
        @for (year of years; track year) {
          <button type="button"
                  class="flex items-center justify-center p-2 rounded-md text-[13px] font-medium transition-all duration-150 year-option"
                  [class.is-selected]="isSelected(year)"
                  (click)="selectYear(year)">
            {{ year }}
          </button>
        }
      </div>
    </div>
  }
</div>
