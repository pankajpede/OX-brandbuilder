<div class="mb-3 select-none">
  <!-- Progress Track -->
  <div class="relative h-1 bg-gray-100 rounded-full overflow-hidden mb-2">
    <div
      class="absolute inset-y-0 left-0 bg-primary transition-all duration-500 ease-out shadow-[0_0_8px_rgba(79,70,229,0.3)]"
      [style.width.%]="progressPercent"></div>
  </div>

  <!-- Steps List -->
  <div class="flex items-start overflow-x-auto pb-0 gap-2 justify-center no-scrollbar scroll-smooth">
    @for (step of steps; track step.index) {
    <button class="group flex flex-col items-center gap-1 px-4 py-1 rounded-md transition-all duration-300" [class]="step.index === currentStep 
          ? '' 
          : step.index < currentStep 
            ? 'hover:bg-gray-50' 
            : 'grayscale hover:grayscale-0 hover:opacity-100 hover:bg-gray-50'" (click)="onStepClick(step.index)"
      [attr.aria-label]="step.title" type="button">
      <!-- Step Indicator -->
      <span
        class="w-4 h-4 rounded-full flex items-center justify-center text-[10px] font-bold transition-all duration-300 shadow-sm bg-gray-800 text-white"
        [class]="step.index === currentStep 
            ? 'bg-black text-white border-transparent' 
            : step.index < currentStep 
              ? 'border-transparent' 
              : 'opacity-50 border-gray-200'">
        @if (step.index < currentStep) { <svg class="w-3 h-3" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12" />
          </svg>
          } @else {
          <span>{{ step.index + 1 }}</span>
          }
      </span>

      <!-- Label -->
      <span class="flex flex-col items-center text-center">
        <span class="text-[10px] transition-colors duration-300"
          [class]="step.index === currentStep ? 'text-black font-medium' : 'font-medium text-gray-900 group-hover:text-black'">
          {{ step.title }}
        </span>
        <!-- <span class="text-[10px] font-bold mt-0.5 tracking-tight"
          [class]="step.index === currentStep ? 'text-gray-400' : 'text-gray-400 group-hover:text-gray-500'">
          {{ step.subtitle }}
        </span> -->
      </span>
    </button>
    }
  </div>
</div>
